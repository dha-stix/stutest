<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 380" preserveAspectRatio="xMidYMid slice"><style>.o{animation:spin 24s linear infinite;transform-box:view-box}.b{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.n{animation:nod 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.t{animation:type .45s ease-in-out infinite alternate;transform-box:fill-box}.d{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 3.2s ease-in-out infinite}.s{animation:steam 3s ease-in-out infinite;transform-box:fill-box}.g{animation:glow 3s ease-in-out infinite}.sl{animation:slide 4s ease-in-out infinite;transform-box:fill-box}.f{animation:flip 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.fc{animation:face 4s steps(1) infinite}.r{animation:ripple 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}@keyframes type{to{transform:translateY(-4px)}}@keyframes draw{0%{stroke-dashoffset:60}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:60}}@keyframes steam{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}@keyframes glow{0%,100%{opacity:.35}50%{opacity:.85}}@keyframes slide{0%,30%,100%{transform:translateY(0)}50%,80%{transform:translateY(-16px)}}@keyframes flip{0%,20%{transform:scaleX(1)}25%{transform:scaleX(0)}30%,70%{transform:scaleX(1)}75%{transform:scaleX(0)}80%,100%{transform:scaleX(1)}}@keyframes face{0%{fill:#0D0F1A}25%{fill:#4F3CF0}75%{fill:#0D0F1A}}@keyframes ripple{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.d{stroke-dashoffset:0}}</style>
